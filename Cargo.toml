[workspace]
resolver = "2"
members = [
    "crates/mk-core",
    "crates/mk-engine",
    "crates/mk-sim",
    "crates/mk-app",
    "crates/mk-cli",
    "crates/mk-web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

mk-core = { path = "crates/mk-core" }
mk-app = { path = "crates/mk-app" }
mk-engine = { path = "crates/mk-engine" }
mk-sim = { path = "crates/mk-sim" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
